[plugin]
name           = "MasterControl"
version        = "1.0.0"
author         = "Vway-yw"
description    = "主人控制面板 - 群聊管理、跨群发消息"
priority       = 50
icon           = "https://avatars.githubusercontent.com/u/307078813?v=4"
dependencies   = []
category       = "Manage"
tags           = ['管理', '群聊', '主人']
repo           = "Vway-yw/loyan-plugins"
docs_url       = "https://github.com/Vway-yw/loyan-plugins"
min_framework  = "0.1.0"
[handler]
entry       = "handle_master"

[trigger]
commands       = ["/群列表", "/发群", "/set群名"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false

[trigger.command_descriptions]
"/群列表"        = "查看机器人所在的所有群聊ID"
"/发群"         = "向指定群聊发送消息（/发群 <群ID> <消息>）"
"/set群名"      = "给群设置备注名（/set群名 <群ID> <名称>）"
