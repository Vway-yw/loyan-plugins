[plugin]
name        = "年龄计算"
version     = "1.0.0"
author      = "Vway-yw"
description = "根据生日计算年龄"

priority    = 50
icon        = "https://avatars.githubusercontent.com/u/307078813?v=4"
dependencies = []

category    = "Life"
tags        = ['年龄', '生日']
repo        = "Vway-yw/loyan-plugins"
docs_url    = "https://github.com/Vway-yw/loyan-plugins"
min_framework = "0.1.0"

[handler]
entry       = "handle_age"

[trigger]
commands       = ["/年龄", "/周岁", "/age"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false

[trigger.command_descriptions]
"/年龄"         = "🎂 年龄计算（/年龄 1996-05-20）"
"/周岁"         = "🎂 同 /年龄"
"/age"        = "🎂 同 /年龄"
