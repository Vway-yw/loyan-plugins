[plugin]
name        = "象棋启动器"
version     = "1.0.0"
author      = "Vway-yw"
description = "检测象棋服务器是否正常运行"
 "https://raw.githubusercontent.com/Vway-yw/loyan-chess-start/main/icon.svg"
category    = "Tool"
tags        = ['象棋', '游戏', '服务器检测']
repo        = "Vway-yw/loyan-chess-start"
docs_url    = "https://github.com/Vway-yw/loyan-chess-start"
min_framework = "0.1.0"

[handler]
entry       = "handle_chess_status"

[trigger]
commands       = ["/chess status"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false
priority       = 60
command_descriptions = {"/chess status" = "检测象棋服务器是否正常运行"}
