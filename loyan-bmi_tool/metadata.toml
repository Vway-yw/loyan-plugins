[plugin]
name        = "BMI计算"
version     = "1.0.0"
author      = "Vway-yw"
description = "身体质量指数计算"

priority    = 50
icon        = "https://avatars.githubusercontent.com/u/307078813?v=4"
dependencies = []

category    = "Life"
tags        = ['BMI', '健康', '体重']
repo        = "Vway-yw/loyan-plugins"
docs_url    = "https://github.com/Vway-yw/loyan-plugins"
min_framework = "0.1.0"

[handler]
entry       = "handle_bmi"

[trigger]
commands       = ["/bmi", "/身体质量", "/体质指数"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false

[trigger.command_descriptions]
"/bmi"        = "📊 BMI 计算（/bmi 65 175）"
"/身体质量"       = "📊 同 /bmi"
"/体质指数"       = "📊 同 /bmi"
