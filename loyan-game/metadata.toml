[plugin]
name        = "游戏插件"
version     = "1.0.0"
author      = "Vway-yw"
priority    = 50
icon        = "https://avatars.githubusercontent.com/u/307078813?v=4"
dependencies = []

description = "钓鱼/挖矿/打猎等小游戏，支持金币、经验、等级、排行榜"

category    = "Entertainment"
tags        = ['游戏', '钓鱼', '挖矿', '打猎', '签到', '排行榜']
repo        = "Vway-yw/loyan-plugins"
docs_url    = "https://github.com/Vway-yw/loyan-plugins"
min_framework = "0.1.0"

[handler]
entry       = "handle_game"

[trigger]
commands       = ["/钓鱼", "钓鱼", "/挖矿", "挖矿", "/打猎", "打猎", "/签到", "签到", "/打工", "打工", "/我的信息", "我的信息", "/排行榜", "排行榜", "/赌大小", "赌大小", "/恢复", "恢复", "/升级", "升级", "/改名", "改名", "/游戏", "游戏", "/游戏帮助", "/game", "/商店", "商店", "/背包", "背包", "/使用", "使用", "/购买", "购买", "/挖宝", "挖宝", "/转盘", "转盘", "/打BOSS", "打BOSS", "打boss", "/boss", "boss", "/任务", "任务", "/成就", "成就", "/技能", "技能", "/大赛", "大赛", "/参赛", "参赛", "/重开", "重开", "/注销", "注销", "/撤销", "撤销", "/list", "list"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false

[trigger.command_descriptions]
"/钓鱼"     = "🎣 去钓鱼！消耗体力捕获各种鱼获"
"/挖矿"     = "⛏️ 去挖矿！寻找各种矿石"
"/打猎"     = "🏹 去打猎！挑战各种猎物"
"/签到"     = "📅 每日签到，获取奖励"
"/打工"     = "💼 打工赚钱，消耗3点体力"
"/我的信息" = "👤 查看你的游戏信息"
"/排行榜"   = "🏆 查看富豪排行榜"
"/赌大小"   = "🎲 赌大小！/赌大小 <大/小> <金额>"
"/恢复"     = "🔋 恢复体力（每1小时可用1次）"
"/升级"     = "⬆️ 花费金币购买经验升级"
"/改名"     = "✏️ 修改昵称，首次免费，之后50金币"
"/商店"     = "🛒 查看游戏商店，购买物品"
"/背包"     = "🎒 查看你的背包物品"
"/使用"     = "💡 使用背包中的物品"
"/购买"     = "🛒 购买物品：/购买 <物品名>"
"/挖宝"     = "🪓 消耗6体力挖掘宝藏"
"/转盘"     = "🎡 转盘赌博：/转盘 <金额>"
"/打BOSS"   = "👊 挑战世界BOSS"
"/任务"     = "📋 查看每日任务"
"/成就"     = "🏅 查看成就列表及解锁进度"
"/技能"     = "📚 查看/升级技能等级"
"/大赛"     = "🎣 查看钓鱼大赛状态"
"/参赛"     = "🎣 报名参加钓鱼大赛"
"/游戏"     = "📖 查看游戏指令大全（含图片帮助）"
