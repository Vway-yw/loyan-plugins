[plugin]
name        = "Loyan配置"
version     = "2.0.0"
author      = "Vway-yw"
icon        = "https://avatars.githubusercontent.com/u/307078813?v=4"
description = "获取 LoyanBot 安装与配置过程"

category    = "Tools"
tags        = ['教程', '安装', '配置']
repo        = "Vway-yw/loyan-config"
docs_url    = "https://github.com/Vway-yw/loyan-config"
min_framework = "0.1.0"

[handler]
entry       = "handle_loyan_get"

[trigger]
commands       = ["/loyan get", "/loyan安装", "/loyan配置"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false
command_descriptions = {"/loyan get" = "获取 LoyanBot 安装与配置过程", "/loyan安装" = "查看 LoyanBot 安装配置教程"}
