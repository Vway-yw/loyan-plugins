[plugin]
name        = "秒表"
version     = "1.0.0"
author      = "Vway-yw"
description = "计时器"

priority    = 50
icon        = "https://avatars.githubusercontent.com/u/307078813?v=4"
dependencies = []

category    = "Tools"
tags        = ['秒表', '计时']
repo        = "Vway-yw/loyan-plugins"
docs_url    = "https://github.com/Vway-yw/loyan-plugins"
min_framework = "0.1.0"

[handler]
entry       = "handle_stopwatch_start"

[trigger]
commands       = ["/秒表开始", "/开始计时", "/计时", "/秒表", "/计时查看", "/stopwatch", "/秒表结束", "/停止计时"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false

[trigger.command_descriptions]
"/秒表开始"       = "⏱️ 开始计时"
"/秒表"         = "⏱️ 查看耗时"
"/秒表结束"       = "⏱️ 结束计时"
"/计时"         = "⏱️ 同 /秒表"
"/开始计时"       = "⏱️ 同 /秒表开始"
"/计时查看"       = "⏱️ 同 /秒表"
"/stopwatch"  = "⏱️ 同 /秒表"
"/停止计时"       = "⏱️ 同 /秒表结束"
