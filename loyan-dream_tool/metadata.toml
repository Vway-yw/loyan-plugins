[plugin]
name        = "解梦"
version     = "1.0.0"
author      = "Vway-yw"
description = "梦境解析（本地库）"

priority    = 50
icon        = "https://avatars.githubusercontent.com/u/307078813?v=4"
dependencies = []

category    = "Life"
tags        = ['解梦', '周公解梦']
repo        = "Vway-yw/loyan-plugins"
docs_url    = "https://github.com/Vway-yw/loyan-plugins"
min_framework = "0.1.0"

[handler]
entry       = "handle_dream"

[trigger]
commands       = ["/解梦", "/周公解梦", "/dream"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false

[trigger.command_descriptions]
"/解梦"         = "🌙 解梦（/解梦 水）"
"/周公解梦"       = "🌙 同 /解梦"
"/dream"      = "🌙 同 /解梦"
