[plugin]
name        = "幸运数字"
version     = "1.0.0"
author      = "Vway-yw"
description = "今日幸运数字/色/方向"

priority    = 50
icon        = "https://avatars.githubusercontent.com/u/307078813?v=4"
dependencies = []

category    = "Life"
tags        = ['幸运', '运势']
repo        = "Vway-yw/loyan-plugins"
docs_url    = "https://github.com/Vway-yw/loyan-plugins"
min_framework = "0.1.0"

[handler]
entry       = "handle_lucky"

[trigger]
commands       = ["/幸运数字", "/幸运", "/lucky"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false

[trigger.command_descriptions]
"/幸运数字"       = "🍀 今日幸运数字"
"/幸运"         = "🍀 同 /幸运数字"
"/lucky"      = "🍀 同 /幸运数字"
