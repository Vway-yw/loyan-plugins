[plugin]
name        = "多时区"
version     = "1.0.0"
author      = "Vway-yw"
description = "世界主要城市时间"

priority    = 50
icon        = "https://avatars.githubusercontent.com/u/307078813?v=4"
dependencies = []

category    = "Life"
tags        = ['时区', '时间']
repo        = "Vway-yw/loyan-plugins"
docs_url    = "https://github.com/Vway-yw/loyan-plugins"
min_framework = "0.1.0"

[handler]
entry       = "handle_tz"

[trigger]
commands       = ["/时区", "/多时区", "/timezone"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false

[trigger.command_descriptions]
"/时区"         = "🌍 多时区（/时区 北京 /时区 纽约）"
"/多时区"        = "🌍 同 /时区"
"/timezone"   = "🌍 同 /时区"
