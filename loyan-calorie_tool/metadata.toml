[plugin]
name        = "卡路里"
version     = "1.0.0"
author      = "Vway-yw"
description = "食物卡路里估算"

priority    = 50
icon        = "https://avatars.githubusercontent.com/u/307078813?v=4"
dependencies = []

category    = "Life"
tags        = ['卡路里', '热量', '健康']
repo        = "Vway-yw/loyan-plugins"
docs_url    = "https://github.com/Vway-yw/loyan-plugins"
min_framework = "0.1.0"

[handler]
entry       = "handle_cal"

[trigger]
commands       = ["/卡路里", "/热量", "/calories"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false

[trigger.command_descriptions]
"/卡路里"        = "🔥 卡路里估算（/卡路里 米饭 200）"
"/热量"         = "🔥 同 /卡路里"
"/calories"   = "🔥 同 /卡路里"
