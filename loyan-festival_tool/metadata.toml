[plugin]
name        = "今日节日"
version     = "1.0.0"
author      = "Vway-yw"
description = "今日节日查询"

priority    = 50
icon        = "https://avatars.githubusercontent.com/u/307078813?v=4"
dependencies = []

category    = "Life"
tags        = ['节日', '日历']
repo        = "Vway-yw/loyan-plugins"
docs_url    = "https://github.com/Vway-yw/loyan-plugins"
min_framework = "0.1.0"

[handler]
entry       = "handle_festival"

[trigger]
commands       = ["/节日", "/今日节日", "/festival"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false

[trigger.command_descriptions]
"/节日"         = "🎉 今日节日查询"
"/今日节日"       = "🎉 同 /节日"
"/festival"   = "🎉 同 /节日"
