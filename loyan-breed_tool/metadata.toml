[plugin]
name        = "狗狗品种"
version     = "1.0.0"
author      = "Vway-yw"
description = "狗狗品种查询/随机品种图片"

priority    = 50
icon        = "https://avatars.githubusercontent.com/u/307078813?v=4"
dependencies = []

category    = "Media"
tags        = ['狗狗', '品种', '宠物']
repo        = "Vway-yw/loyan-plugins"
docs_url    = "https://github.com/Vway-yw/loyan-plugins"
min_framework = "0.1.0"

[handler]
entry       = "handle_breeds"

[trigger]
commands       = ["/犬种", "/狗狗品种", "/breeds"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false

[trigger.command_descriptions]
"/犬种"         = "🐶 随机犬种（/犬种 猎犬 指定）"
"/狗狗品种"       = "🐶 同 /犬种"
"/breeds"     = "🐶 同 /犬种"
