[plugin]
name        = "成语词典"
version     = "1.0.0"
author      = "Vway-yw"
description = "常用成语查询（3000条，含释义）"

priority    = 50
icon        = "https://avatars.githubusercontent.com/u/307078813?v=4"
dependencies = []

category    = "Tools"
tags        = ['成语', '词典', '查询']
repo        = "Vway-yw/loyan-plugins"
docs_url    = "https://github.com/Vway-yw/loyan-plugins"
min_framework = "0.1.0"

[handler]
entry       = "handle_idiom_dict"

[trigger]
commands       = ["/成语词典", "/查成语", "/idiom"]
chat_type      = ["private", "group"]
permission     = "all"
is_at_required = false

[trigger.command_descriptions]
"/成语词典"       = "📖 成语查询（/成语词典 一马当先）"
"/查成语"        = "📖 同 /成语词典"
"/idiom"      = "📖 同 /成语词典"
